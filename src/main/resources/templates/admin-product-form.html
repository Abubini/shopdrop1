<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${product.id} != null ? 'Edit product — ShopDrop' : 'Add product — ShopDrop'">Product form</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="container narrow">
  <h1 class="page-title" th:text="${product.id} != null ? 'Edit product' : 'Add product'">Add product</h1>

  <form th:action="@{${formAction}}" method="post" class="checkout-form" id="product-form">
    <label for="name">Name</label>
    <input id="name" type="text" name="name" th:value="${product.name}" required>

    <label for="description">Description</label>
    <input id="description" type="text" name="description" th:value="${product.description}">

    <label for="categoryId">Category</label>
    <select id="categoryId" name="categoryId" required>
      <option th:each="category : ${categories}"
              th:value="${category.id}"
              th:text="${category.name}"
              th:selected="${product.category != null and product.category.id == category.id}">
        Category
      </option>
    </select>

    <label for="price">Price</label>
    <input id="price" type="number" step="0.01" min="0.01" name="price" th:value="${product.price}" required>

    <label for="stockQuantity">Stock quantity</label>
    <input id="stockQuantity" type="number" step="1" min="0" name="stockQuantity" th:value="${product.stockQuantity}" required>

    <label for="icon">Icon (emoji, optional)</label>
    <input id="icon" type="text" name="icon" th:value="${product.icon}">

    <button type="submit" class="btn btn-primary" id="save-product-btn" style="margin-top:16px;">Save</button>
  </form>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
