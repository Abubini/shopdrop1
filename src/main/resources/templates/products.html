<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopDrop &mdash; Products</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="container">
  <h1 class="page-title">Products</h1>

  <form th:action="@{/products}" method="get" class="search-form" id="search-form">
    <input type="hidden" name="categoryId" th:if="${selectedCategoryId != null}" th:value="${selectedCategoryId}">
    <input type="text" name="q" th:value="${query}" placeholder="Search products&hellip;" id="search-input">
    <button type="submit" class="btn btn-small" id="search-btn">Search</button>
  </form>

  <div class="category-filter" id="category-filter">
    <a th:href="@{/products}" th:classappend="${selectedCategoryId == null} ? ' active'" id="category-all">All</a>
    <a th:each="category : ${categories}"
       th:href="@{/products(categoryId=${category.id})}"
       th:classappend="${selectedCategoryId != null and selectedCategoryId == category.id} ? ' active'"
       th:text="${category.name}"
       th:attr="id='category-' + ${category.id}">Category</a>
  </div>

  <div th:if="${#lists.isEmpty(products)}" class="empty-state" id="no-products-found">
    <p>No products match your search.</p>
  </div>

  <div class="grid" id="product-grid">
    <a class="card product-card" th:each="product : ${products}"
       th:href="@{'/products/' + ${product.id}}"
       th:attr="data-testid='product-card-' + ${product.id}">
      <div class="product-icon" th:text="${product.icon}">&#128230;</div>
      <h3 th:text="${product.name}">Name</h3>
      <p class="muted" th:text="${product.category.name}">Category</p>
      <p class="price" th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}">$0.00</p>
    </a>
  </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
