<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin &mdash; Products &mdash; ShopDrop</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="container">
  <div class="admin-header-row">
    <h1 class="page-title">Manage Products</h1>
    <a class="btn btn-primary" id="new-product-btn" th:href="@{/admin/products/new}">Add product</a>
  </div>

  <table class="cart-table" id="admin-products-table">
    <thead>
      <tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
    </thead>
    <tbody>
      <tr th:each="product : ${products}" th:attr="data-testid='admin-product-row-' + ${product.id}">
        <td th:text="${product.name}">Name</td>
        <td th:text="${product.category.name}">Category</td>
        <td th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}">$0.00</td>
        <td th:text="${product.stockQuantity}">0</td>
        <td class="action-cell">
          <a class="btn btn-small" th:href="@{'/admin/products/' + ${product.id} + '/edit'}"
             th:attr="id='edit-btn-' + ${product.id}">Edit</a>
          <form th:action="@{'/admin/products/' + ${product.id} + '/delete'}" method="post">
            <button type="submit" class="btn btn-small btn-ghost" th:attr="id='delete-btn-' + ${product.id}"
                    onclick="return confirm('Delete this product?');">Delete</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
