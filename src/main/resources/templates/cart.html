<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart &mdash; ShopDrop</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="container narrow">
  <h1 class="page-title">Your Cart</h1>

  <div th:if="${#lists.isEmpty(lines)}" class="empty-state" id="empty-cart">
    <p>Your cart is empty.</p>
    <a class="btn btn-primary" th:href="@{/products}">Browse products</a>
  </div>

  <div th:unless="${#lists.isEmpty(lines)}">
    <table class="cart-table" id="cart-table">
      <thead>
        <tr>
          <th>Item</th>
          <th>Price</th>
          <th>Qty</th>
          <th>Line total</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="line : ${lines}" th:attr="data-testid='cart-row-' + ${line.product.id}">
          <td th:text="${line.product.name}">Name</td>
          <td th:text="'$' + ${#numbers.formatDecimal(line.product.price, 1, 2)}">$0.00</td>
          <td>
            <form th:action="@{/cart/update}" method="post" class="qty-form">
              <input type="hidden" name="productId" th:value="${line.product.id}">
              <input type="number" name="quantity" th:value="${line.quantity}" min="0" max="99">
              <button type="submit" class="btn btn-small">Update</button>
            </form>
          </td>
          <td th:text="'$' + ${#numbers.formatDecimal(line.lineTotal, 1, 2)}">$0.00</td>
          <td>
            <form th:action="@{/cart/remove}" method="post">
              <input type="hidden" name="productId" th:value="${line.product.id}">
              <button type="submit" class="btn btn-small btn-ghost">Remove</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="cart-summary">
      <p>Subtotal: <strong id="cart-subtotal" th:text="'$' + ${#numbers.formatDecimal(subtotal, 1, 2)}">$0.00</strong></p>
      <a class="btn btn-primary" id="checkout-link" th:href="@{/checkout}">Checkout</a>
    </div>
  </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
