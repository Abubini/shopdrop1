services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: shopdrop-jenkins
    privileged: true
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Mounting the host's Docker socket lets Jenkins run pipeline stages
      # inside Docker agents (see the `agent { docker { ... } }` block in
      # the Jenkinsfile) without installing Docker-in-Docker.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
